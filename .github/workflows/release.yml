name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: '[ "${GITHUB_REF_NAME#v}" = "$(node -p "require(\"./package.json\").version")" ]'
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: npx vsce publish --oidc --packagePath *.vsix
      - run: npx ovsx publish --trusted-publishing --skip-duplicate *.vsix
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes *.vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
